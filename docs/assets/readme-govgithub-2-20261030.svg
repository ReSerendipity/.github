<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'Noto Sans CJK SC','Noto Sans',-apple-system,'Segoe UI',sans-serif">
  <title>变更门禁流程：开工四查 → 分支/PR → CI → 合并 → 按需审计</title>
  <desc>ReSerendipity/.github 治理变更流程（REPOSITORY_GUIDELINES §17）：开工前四查、分支与 PR 约定、CI 门禁、合并规则、按需审计（workflow_dispatch），以及 CI 失败闭环。</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>

  <text x="40" y="42" font-size="27" font-weight="700" fill="#1f2328">变更门禁流程 · Change Gate Flow</text>
  <text x="40" y="66" font-size="14" fill="#57606a">依据 REPOSITORY_GUIDELINES.md §17（任务收尾 / 提交 / CI 收敛）与 §2（分支规范）；不含 release 链（§10 另计）</text>

  <!-- 步骤 ① 开工前四查 -->
  <rect x="60" y="90" width="1080" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="92" cy="136" r="21" fill="#0969da"/>
  <text x="92" y="142" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="128" y="120" font-size="16" font-weight="700" fill="#1f2328">开工前四查 · Pre-work checks（§17.5，每个仓开始任务前必做）</text>
  <text x="128" y="144" fill="#57606a" font-size="12.5">① git fetch + status --short + log --oneline -5 + rev-list --left-right --count origin/main...HEAD</text>
  <text x="128" y="164" fill="#57606a" font-size="12.5">② git worktree list --porcelain（同一仓多个工作区 = 多 agent 迹象）　③ .git/agent-session.lock 心跳（≤10 分钟 = 活跃会话）　④ dirty 文件 mtime 判活跃度（≤10 分钟 = 高度活跃）</text>

  <!-- 步骤 ② 分支 / PR -->
  <rect x="60" y="198" width="1080" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="92" cy="244" r="21" fill="#0969da"/>
  <text x="92" y="250" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="128" y="228" font-size="16" font-weight="700" fill="#1f2328">分支 / PR · Branch &amp; PR（§17.2）</text>
  <text x="128" y="252" fill="#57606a" font-size="12.5">功能分支 feat/* fix/* ci/* chore/*；git commit -s（DCO，身份用 noreply）；git add -- 显式路径（禁止 git add -A / git add .）</text>
  <text x="128" y="272" fill="#57606a" font-size="12.5">作者账号 + 无多 agent + 预检全绿 + enforce_admins=false：可直推；检测到多 agent 或非作者协作者：一律分支 + PR + 必需检查 + 审批</text>

  <!-- 步骤 ③ CI 门禁 -->
  <rect x="60" y="306" width="1080" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="92" cy="352" r="21" fill="#0969da"/>
  <text x="92" y="358" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="128" y="336" font-size="16" font-weight="700" fill="#1f2328">CI 门禁 · CI gates（ci.yml + drift-audit.yml）</text>
  <text x="128" y="360" fill="#57606a" font-size="12.5">Workflow lint（actionlint + YAML）｜DCO sign-off｜Reusable workflow smoke（self-purify 核心规则，阻断）｜Repository registry（§4 vs GitHub）｜Governance gates negative tests</text>
  <text x="128" y="380" fill="#57606a" font-size="12.5">命中 governance/desired-state.json 的 PR 另触发治理漂移审计；§10 发布标准审计只在手动作业上运行（非每 PR 门禁）</text>

  <!-- 步骤 ④ 合并 -->
  <rect x="60" y="414" width="1080" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="92" cy="460" r="21" fill="#0969da"/>
  <text x="92" y="466" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="128" y="444" font-size="16" font-weight="700" fill="#1f2328">合并 · Merge（§2 / §17.2）</text>
  <text x="128" y="468" fill="#57606a" font-size="12.5">作者账号可直推 main（enforce_admins=false 是有意为之：保护不约束账号本人，代价须写明白）；非管理员协作者一律走 PR</text>
  <text x="128" y="488" fill="#57606a" font-size="12.5">delete_branch_on_merge=true：合并后 GitHub 自动删除源分支；禁止 force push（仅 --force-with-lease 且需授权）；不得删除默认分支 / gh-pages / release-please 工作分支</text>

  <!-- 步骤 ⑤ 按需审计 -->
  <rect x="60" y="522" width="1080" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="92" cy="568" r="21" fill="#0969da"/>
  <text x="92" y="574" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="128" y="552" font-size="16" font-weight="700" fill="#1f2328">按需审计 · On-demand audits（workflow_dispatch / PR）</text>
  <text x="128" y="576" fill="#57606a" font-size="12.5">§4 台账 + 一致性随每次 PR / 推送自动跑｜漂移审计：手动或命中 desired-state.json 的 PR｜OSSF Scorecard：手动（11 仓矩阵）</text>
  <text x="128" y="596" fill="#57606a" font-size="12.5">§10 发布标准审计是 ci.yml 的手动作业；2026-10-30 owner 裁决取消全部 schedule cron，对账频度由维护者手动触发保证</text>

  <!-- 步骤间箭头 -->
  <path d="M600,182 L600,196" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M600,290 L600,304" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M600,398 L600,412" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M600,506 L600,520" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- CI 失败闭环 -->
  <rect x="60" y="634" width="1080" height="52" rx="10" fill="#fff8f4" stroke="#e8a64b" stroke-dasharray="6,4"/>
  <circle cx="92" cy="660" r="15" fill="#bf8700"/>
  <text x="92" y="665" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="120" y="655" font-size="14" font-weight="700" fill="#9a6700">CI 失败闭环（§17.3）</text>
  <text x="120" y="673" fill="#57606a" font-size="12.5">先 commit 使工作区干净 → 再 push 触发 CI → 盯到绿色；失败先在本地复现 → 最小修复 → 重新提交 → 再推，循环到绿。禁止 --no-verify 绕过、禁止关检查、禁止删工作流；同类失败二次出现按 §7.4 自进化记录</text>
  <path d="M1140,398 L1150,398 L1150,600 L1160,600" stroke="#bf8700" stroke-width="1.6" stroke-dasharray="6,4" fill="none"/>
  <path d="M1160,660 L1150,660 L1150,680 L600,680 L600,664" stroke="#bf8700" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#arr)"/>

  <!-- 完成定义 -->
  <text x="60" y="714" font-size="13" font-weight="700" fill="#1f2328">完成定义（§17）：</text>
  <text x="212" y="714" font-size="12.5" fill="#57606a">改动已实现并通过本地验证 ｜ 工作区干净（git status 只剩本次改动）｜ 分批提交 + 显式路径 + DCO ｜ 有 CI 已盯到终态 / 无 CI 本地检查全绿 ｜ 已推送合并、临时资源已清理</text>
</svg>
