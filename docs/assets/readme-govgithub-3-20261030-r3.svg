<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'Noto Sans CJK SC','Noto Sans',-apple-system,'Segoe UI',sans-serif">
  <title>48 仓治理分档矩阵：lifecycle × delivery</title>
  <desc>ReSerendipity 账号 48 个仓库按 lifecycle（active / maintenance / archived）与 delivery（policy / release / library / service / tool / content / backup）分档的数量矩阵，数据来自 governance/desired-state.json。</desc>
  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>

  <text x="40" y="42" font-size="27" font-weight="700" fill="#1f2328">48 仓治理分档矩阵 · Tiering Matrix</text>
  <text x="40" y="66" font-size="14" fill="#57606a">lifecycle × delivery（截至 2026-10-29）｜逐仓定位以 governance/desired-state.json 为唯一事实来源（version 2，48 条）</text>
  <text x="40" y="88" font-size="12.5" fill="#57606a">口径：§4 台账 40 行（例外名 8 + Train Case 32）+ 8 备份仓 = 48；2026-10-29 实测 gh repo list 48 个，零差额</text>

  <!-- 列头：lifecycle -->
  <g>
    <rect x="268" y="118" width="300" height="52" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="418" y="140" font-size="15" font-weight="700" fill="#0969da" text-anchor="middle">active（活跃）</text>
    <text x="418" y="158" font-size="12" fill="#57606a" text-anchor="middle">变更许可 + 周检 · 12 仓</text>
    <rect x="576" y="118" width="300" height="52" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="726" y="140" font-size="15" font-weight="700" fill="#9a6700" text-anchor="middle">maintenance（维护）</text>
    <text x="726" y="158" font-size="12" fill="#57606a" text-anchor="middle">仅修复 / 密钥轮换 · 月检 · 24 仓</text>
    <rect x="884" y="118" width="300" height="52" rx="6" fill="#eaeef2" stroke="#afbac4"/>
    <text x="1034" y="140" font-size="15" font-weight="700" fill="#57606a" text-anchor="middle">archived（归档）</text>
    <text x="1034" y="158" font-size="12" fill="#6e7781" text-anchor="middle">平台只读 · 不检 · 12 仓</text>
  </g>

