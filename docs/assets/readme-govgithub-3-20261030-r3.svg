    <text x="1034" y="425" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  </g>
  <!-- content -->
  <g>
    <rect x="40" y="448" width="220" height="52" rx="6" fill="#fffbf0" stroke="#e6c06a"/>
