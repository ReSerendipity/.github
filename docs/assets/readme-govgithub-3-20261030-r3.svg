  <!-- 图例与语义 -->
  <g font-size="12.5" fill="#57606a">
    <text x="40" y="636" font-weight="700" fill="#1f2328">语义：</text>
    <text x="96" y="636">lifecycle（主轴）决定变更许可与审计频率 —— active 允许新功能、周检；maintenance 仅修复与密钥轮换、月检；archived 平台只读、不检</text>
    <text x="96" y="656">delivery（副轴）决定适用条款（§15.3）—— policy §1–§20；release §1–§14（§10 按 distribution 取子集）；library / service / tool / content 取相应子集；backup 仅 §3；§17 / §18 / §20 跨档通用</text>
    <text x="40" y="680" font-weight="700" fill="#1f2328">校验：</text>
    <text x="96" y="680">check-governance-consistency.sh 校验 JSON 仓集合 == GitHub 实际集合、JSON 内部取值合法、脚本豁免项数与文档声明一致、governance/README.md 的「40 + 8」== 总数 48</text>
    <text x="40" y="704" font-weight="700" fill="#1f2328">修改定位：</text>
    <text x="136" y="704">同时改 REPOSITORY_GUIDELINES.md 与 desired-state.json；audit-drift.py 在周检 / 手动 / 命中 JSON 的 PR 上对账，漂移判红（2026-10-30 定稿：远程优先、本地最少化）</text>
  </g>
</svg>
