name: Family Self-Purify Check

# 家族「自净化」复用检查（2026-09-10 建立）。
# 由各仓库 .github/workflows/self-purify.yml 以 workflow_call 接入。
# 覆盖三类此前无人值守、只能靠人工审计的规则：
#   ① 本地治理文档（docs/plans|project|_devarchive|agents|execution、LOCAL_RULES、FIX_LOG、
#      任意深度 AGENTS.md）被 git 跟踪
#      注：docs/reports 与 docs/repo-analysis 中经人工审定发布的文档白名单放行（如分发执行总结）
#      仓级豁免（2026-10-20 补）：调用仓可通过 extra_exempt_regex 声明自身已明文裁决的公开归档
#      目录——例 SpiritPal 的 LOCAL_RULES.md 第 4 条（2026-10-17 更正）把 docs/execution/ 定为
#      公开层归档处。豁免由调用仓自己声明，家族基线不放宽。
#      私有仓若接入本检查须先按 §7 私有仓例外调整：私有仓 AGENTS.md 应上传作备份，不属本项违规。
#   ② 根目录残留 CONTRIBUTING/CODE_OF_CONDUCT/SUPPORT（应继承 org 级 ReSerendipity/.github）
#   ③ README 未引用 org 级仓库（组织级健康文档链接缺失）
#      ②③ 对 ReSerendipity/.github 本身跳过：该仓就是这些文件与引用的来源。
# 说明：AGENTS.md 为本地独享文件（gitignored），CI 拉取的检出中不存在，故其行数上限无法
#       在此检查。上限与载体已于 2026-10-17 补齐：数值 300 行（§7，取自本机 14 个根级
#       AGENTS.md 的实测分布，非拍定），执行载体是 .github/scripts/check-agents-md-size.sh。
#       它仍是本地命令而非门禁：本仓没有 AGENTS.md，在此装 pre-commit 钩子永远不会触发，
#       所以只由各仓自行决定是否把该脚本挂进自己的 .git/hooks。不要把它当成已强制自检。
# 默认保留家族非阻塞语义。调用方审计并准备好阻断本地治理文档后，可传
# enforce_critical_checks: true；只有该核心规则会进入独立阻断 job。

on:
  workflow_call:
    inputs:
      enforce_critical_checks:
        description: 是否将本地治理文档不得被跟踪设为阻断门禁（默认关闭以兼容现有仓库）
        required: false
        type: boolean
        default: false
      extra_exempt_regex:
        description: 调用仓自定义豁免（POSIX ERE，匹配 git ls-files 输出路径）；用于该仓已明文裁决的公开归档目录，留空则仅用家族基线白名单
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  critical-governance:
    if: inputs.enforce_critical_checks
    name: 自净化核心规则（阻断）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 本地治理文档不得被 git 跟踪
        run: |
          HITS=$(git ls-files | grep -E '^(docs/(plans|project|_devarchive|agents|execution)/|LOCAL_RULES\.md$|FIX_LOG\.md$|(.*/)?AGENTS\.md$)' \
            | grep -vE '^(docs/reports/(落地执行总结|执行对照表)-桌面分发与安全加固-20260910\.md|docs/execution/(RELEASE_VERIFICATION\.md|(执行对照表|落地执行总结)-桌面分发与安全加固-20260910\.md|依赖与安全跟踪机制-20260911\.md)|docs/project/(KNOWN_GOTCHAS\.md|AI_DEV_SOPS\.md))$' || true)
          # 存量兼容（2026-10-23）：迁移完成前，≤50 行 + 契约标记的根 AGENTS.md 暂放行；
          # 目标规则见 §7.3 / ADR-0008：任何被跟踪的 AGENTS.md 均阻断。
          ALLOWED_ROOT_AGENTS=0
          if git ls-files --error-unmatch AGENTS.md >/dev/null 2>&1; then
            LINES=$(wc -l < AGENTS.md | tr -d ' ')
            if [ "$LINES" -le 50 ] && grep -q '<!-- governance:agent-contract v1 -->' AGENTS.md; then
              ALLOWED_ROOT_AGENTS=1
            fi
          fi
          if [ "$ALLOWED_ROOT_AGENTS" -eq 1 ] && [ -n "$HITS" ]; then
            HITS=$(printf '%s\n' "$HITS" | grep -vx 'AGENTS.md' || true)
          fi
          # 调用仓豁免（2026-10-20）：extra_exempt_regex 由调用仓在自身 workflow 里声明。
          # 空串必须跳过——grep -vE "" 会匹配所有行，把违规静默吞成通过。
          if [ -n "$HITS" ] && [ -n "${{ inputs.extra_exempt_regex }}" ]; then
            HITS=$(printf '%s\n' "$HITS" | grep -vE "${{ inputs.extra_exempt_regex }}" || true)
          fi
          if [ -n "$HITS" ]; then
            echo "::error::以下本地治理文档被 git 跟踪，或根 AGENTS.md 不符合存量兼容条件（应 git rm --cached；迁移目标：任何 tracked AGENTS.md 均阻断，见 §7.3）："
            echo "$HITS"
            exit 1
          fi
          echo "OK：无本地治理文档被跟踪（存量兼容：根 AGENTS.md 暂放行）"

  self-purify:
    name: 自净化检查
    # 保留现有家族兼容语义：其余健康检查继续告警但不阻断调用仓库。
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ① 本地治理文档不得被 git 跟踪
        if: ${{ !inputs.enforce_critical_checks }}
        run: |
          HITS=$(git ls-files | grep -E '^(docs/(plans|project|_devarchive|agents|execution)/|LOCAL_RULES\.md$|FIX_LOG\.md$|(.*/)?AGENTS\.md$)' \
            | grep -vE '^(docs/reports/(落地执行总结|执行对照表)-桌面分发与安全加固-20260910\.md|docs/execution/(RELEASE_VERIFICATION\.md|(执行对照表|落地执行总结)-桌面分发与安全加固-20260910\.md|依赖与安全跟踪机制-20260911\.md)|docs/project/(KNOWN_GOTCHAS\.md|AI_DEV_SOPS\.md))$' || true)
          # 存量兼容（2026-10-23）：迁移完成前，≤50 行 + 契约标记的根 AGENTS.md 暂放行；
          # 目标规则见 §7.3 / ADR-0008：任何被跟踪的 AGENTS.md 均阻断。
          ALLOWED_ROOT_AGENTS=0
          if git ls-files --error-unmatch AGENTS.md >/dev/null 2>&1; then
            LINES=$(wc -l < AGENTS.md | tr -d ' ')
            if [ "$LINES" -le 50 ] && grep -q '<!-- governance:agent-contract v1 -->' AGENTS.md; then
              ALLOWED_ROOT_AGENTS=1
            fi
          fi
          if [ "$ALLOWED_ROOT_AGENTS" -eq 1 ] && [ -n "$HITS" ]; then
            HITS=$(printf '%s\n' "$HITS" | grep -vx 'AGENTS.md' || true)
          fi
          # 调用仓豁免（2026-10-20）：extra_exempt_regex 由调用仓在自身 workflow 里声明。
          # 空串必须跳过——grep -vE "" 会匹配所有行，把违规静默吞成通过。
          if [ -n "$HITS" ] && [ -n "${{ inputs.extra_exempt_regex }}" ]; then
            HITS=$(printf '%s\n' "$HITS" | grep -vE "${{ inputs.extra_exempt_regex }}" || true)
          fi
          if [ -n "$HITS" ]; then
            echo "::error::以下本地治理文档被 git 跟踪，或根 AGENTS.md 不符合存量兼容条件（应 git rm --cached；迁移目标：任何 tracked AGENTS.md 均阻断，见 §7.3）："
            echo "$HITS"
            exit 1
          fi
          echo "OK：无本地治理文档被跟踪（存量兼容：根 AGENTS.md 暂放行）"

      - name: ② 根目录健康文件应继承自 org ReSerendipity/.github
        # 本仓库正是这些健康文件的提供方，对它套用 ② 会把自身的交付物判为违规。
        if: ${{ github.repository != 'ReSerendipity/.github' }}
        run: |
          HITS=$(git ls-files -- 'CONTRIBUTING.md' 'CODE_OF_CONDUCT.md' 'SUPPORT.md')
          if [ -n "$HITS" ]; then
            echo "::error::根目录不应存在以下健康文件（继承自 ReSerendipity/.github）："
            echo "$HITS"
            exit 1
          fi
          echo "OK：健康文件由 org 级仓库提供"

      - name: ③ README 必须引用 org 级仓库
        # 同理：要求默认仓的 README 引用它自己（字面量 ReSerendipity/.github）
        # 是把下游仓的规则套到了规则来源仓上，本仓 README 从来没有也不应有这一行。
        if: ${{ github.repository != 'ReSerendipity/.github' }}
        run: |
          if [ -f README.md ] && ! grep -q 'ReSerendipity/.github' README.md; then
            echo "::error::README.md 未引用 org 级 ReSerendipity/.github（组织级健康文档链接缺失）"
            exit 1
          fi
          echo "OK：README 已引用 org 级仓库"
