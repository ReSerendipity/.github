# OpenSSF Scorecard 周检（2026-10-30 定稿：公开仓免费额度，schedule 与 workflow_dispatch 并存）：固定版本二进制 + SHA256 校验，矩阵扫描 10 个非归档 release 仓 + 规范仓。
# 归档的 Android-IconAutoArrange 按 §15.2 跳过；新增的 VOSR2-Lite 已纳入。
# 结果写 step summary；每个仓的 JSON 作为 artifact 保留 30 天。
name: OpenSSF Scorecard

on:
  schedule:
    # 周一 05:00 UTC = 13:00 Asia/Shanghai（错开 04:00 的治理漂移审计）
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard (${{ matrix.repo }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        repo:
          - .github
          - Card-Studio
          - DraftPeek
          - Health-Info-Card
          - Image-DuoModel
          - Lineart-Painter
          - MiniMax-H3-Lite
          - SeedVR2-Lite
          - SpiritPal
          - TTS-MultiModel
          - VOSR2-Lite
    steps:
      - name: Install scorecard v5.6.0
        env:
          VERSION: 5.6.0
          ARCHIVE_SHA256: 19bde07129450cb65a95c6e3b9f34e034341579e6f0e241546ec3ae6efb2dd9a
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_${VERSION}_linux_amd64.tar.gz" \
            --output scorecard.tar.gz
          echo "${ARCHIVE_SHA256}  scorecard.tar.gz" | sha256sum --check --strict -
          tar -xzf scorecard.tar.gz scorecard
          sudo install -m 0755 scorecard /usr/local/bin/scorecard
      - name: Run scorecard (full checks)
        if: matrix.repo != '.github'
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p results
          scorecard --repo="github.com/ReSerendipity/${{ matrix.repo }}" \
            --format json --output "results/result.json" \
            --show-details
      - name: Run scorecard (本仓排除 Branch-Protection)
        if: matrix.repo == '.github'
        # 本仓用经典分支保护；GITHUB_TOKEN 读不到经典保护规则，Branch-Protection 会
        # 直接判 internal error。只对本仓排除该项，其余 10 个 release 仓仍跑全量。
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p results
          scorecard --repo="github.com/ReSerendipity/${{ matrix.repo }}" \
            --format json --output "results/result.json" \
            --show-details \
            --checks Code-Review,Contributors,Dangerous-Workflow,Security-Policy,Vulnerabilities,Fuzzing,SAST,CII-Best-Practices,Token-Permissions,Packaging,License,Binary-Artifacts,Maintained,CI-Tests,Signed-Releases,Pinned-Dependencies,Dependency-Update-Tool
      - name: Write step summary
        if: always()
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" "results/result.json" <<'PY'
          import json
          import sys

          summary_path, result_path = sys.argv[1], sys.argv[2]
          try:
              with open(result_path, encoding="utf-8") as handle:
                  data = json.load(handle)
          except OSError:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("- 未生成结果（见失败日志）\n")
              raise SystemExit(0)

          name = (data.get("repo") or {}).get("name", "")
          score = data.get("score", 0)
          low = sorted(
              (
                  check
                  for check in data.get("checks", [])
                  if isinstance(check.get("score"), (int, float)) and check["score"] <= 3
              ),
              key=lambda check: check["score"],
          )[:4]

          with open(summary_path, "a", encoding="utf-8") as handle:
              handle.write(f"### {name} — {score}/10\n\n")
              if low:
                  handle.write("| 低分项 | 分值 | 说明 |\n|---|---|---|\n")
                  for check in low:
                      reason = (check.get("reason") or "").replace("|", "\\|")[:160]
                      handle.write(f"| {check.get('name')} | {check['score']} | {reason} |\n")
              else:
                  handle.write("无 ≤3 分的检查项。\n")
              handle.write("\n")
          PY
      - name: Upload JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-${{ matrix.repo }}
          path: results/
          retention-days: 30
