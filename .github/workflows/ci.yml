# .github (org health): validate all reusable workflow definitions
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 2026-10-30 owner 裁决：取消 `schedule` 周检。workflow_dispatch 只唤醒
  # release-standard-audit（§10 收敛对账）这一个作业，其余作业由 if 排除；
  # 「本仓无改动、台账被外部动作改漂移」的场景由 drift-audit.yml 的手动触发
  # 与命中 desired-state.json 的 PR 承担。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Workflow lint (actionlint + YAML)
    # 手动派发只为跑 §10 审计，本作业与门禁无关，跳过避免空跑。
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install actionlint v1.7.12
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" \
            | sha256sum --check --strict -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: Lint all workflow files
        run: actionlint -color .github/workflows/*.yml
      - name: Validate YAML parses
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = []
          for f in glob.glob('.github/workflows/*.yml'):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad.append(f'{f}: {e}')
          if bad:
              print('\n'.join(bad), file=sys.stderr)
              sys.exit(1)
          print(f'YAML OK ({len(glob.glob(".github/workflows/*.yml"))} files)')
          EOF

  signoff:
    name: DCO sign-off (Signed-off-by)
    # 手动派发不带 PR/push 上下文：BASE_SHA 取到空值，check-signoff.sh 按"失败关闭"
    # 退 2，不加这条每次手动触发都会白红一次（常红的门禁等于没有门禁）。
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      # 只检查本次改动引入的提交区间，不重扫全史：main 上已存在的两笔未签名
      # 历史提交会让门禁从第一次运行起就常红，而常红的门禁等于没有门禁。
      # 区间无法解析时脚本退 2（失败关闭），不会因取不到基线而静默放行。
      - name: Check every new commit carries Signed-off-by
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/check-signoff.sh "$BASE_SHA" "$HEAD_SHA"

  # 给本仓自身承载的复用工作流一个真实执行载体：这两个文件都是 on: workflow_call，
  # 本仓从不触发它们（远程运行史 total_count=0），而 python-quality-baseline.yml
  # 自己要求「修改等于同时修改四个仓库的门禁行为，合并前须在至少一个试点仓跑绿」，
  # 此前该要求在本仓没有任何载体，改动只能等下游第一次调用时才暴露问题。
  # python-quality-baseline.yml 无法在此冒烟：它的 package 输入是必填，且 test-cov
  # 跑 pytest --cov-fail-under、typecheck 跑 mypy ratchet，而本仓无 Python 包/测试，
  # 硬套只会常红。仍留在待办（需带样例输入的试点仓）。
  self-purify-smoke:
    name: Reusable workflow smoke (self-purify)
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/self-purify.yml
    with:
      enforce_critical_checks: true

  # §4 现网仓库对照表此前只有本地命令 `bash .github/scripts/check-repo-registry.sh`
  # 一个载体，跑不跑取决于人记不记得，属"本机算力 + 记性"两重依赖的手工检查。
  # 挪到远端后，任何 PR 与本仓推送都会自动对账文档与 GitHub 现网，本机不再需要跑它
  # （schedule 周检 2026-10-30 取消；外部动作引起的漂移由 drift-audit.yml 手动 / 命中 JSON 的 PR 对账）。
  # 同一作业同时跑 check-governance-consistency.sh 的 --public-only 模式：
  # desired-state / §4 / 文档计数的一致性也在每次 PR 与推送时校验；完整 48 仓
  # （含 21 个私有仓）仍需本地 owner 凭据运行同一脚本的无参模式。
  # 退出码口径沿用脚本：1=文档与现网有差集，2=取数无法判定（网络/凭据/限流）；
  # 两者都判红，与本仓"失败关闭、不把空集合当通过"的口径一致。
  repo-registry:
    name: Repository registry (§4 vs GitHub)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # 该脚本只发 GET（users/<owner>/repos），token 只用于免限流，不需要额外权限。
      - name: §4 对照表与现网仓库一致
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_OWNER: ReSerendipity
        run: bash .github/scripts/check-repo-registry.sh
      - name: 期望状态与文档计数一致（公开子集）
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNANCE_OWNER: ReSerendipity
        run: bash .github/scripts/check-governance-consistency.sh --public-only

  # §10 收敛核验脚本此前同样只有本地命令载体。与 repo-registry 不同的是：
  # 它需要逐仓检出文件树（按 `gh repo list` 批量浅克隆全部公开仓；私有仓对
  # GITHUB_TOKEN 不可见，但 11 个 release 仓均为公开仓），放进每次 PR 会显著拖慢 CI，
  # 且定位是"审计 + 进度对账"而非门禁（§10.7），故只在 workflow_dispatch 手动触发上跑
  # （原 schedule 周检 2026-10-30 取消）。
  # 退出码口径沿用脚本：1=存在与 §10 已裁决口径冲突的 FAIL 项，2=入参不可用；
  # FAIL 判红。豁免仓（§10 排除清单 37 项 = 48 − 11 个 release 仓）由脚本内 EXCLUDED_FROM_RELEASE_STANDARD 声明，
  # 与 REPOSITORY_GUIDELINES.md §10 保持同源。
  # 门禁自身也需要被测试：正例必须绿、负例必须红，防止「把断言改松」这种静默退化。
  # 覆盖 registry / release / agents / signoff 四类载体；不加入必需检查。
  negative-tests:
    name: Governance gates negative tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run gate negative tests
        run: bash .github/scripts/tests/run-negative-tests.sh

  release-standard-audit:
    name: Release standard audit (§10, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Shallow-clone account repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _repos
          # gh repo list 取公开仓；浅克隆 depth 1 即满足脚本只读文件树的需要。
          # clone 失败判致命（与 repo-registry 的"取不到数也判红"口径一致），
          # 静默跳过会让缺检的仓假绿。
          for r in $(gh repo list ReSerendipity --limit 200 --json name --jq '.[].name'); do
            gh repo clone "ReSerendipity/$r" "_repos/$r" -- --depth 1 --quiet \
              || { echo "::error::clone failed: $r"; exit 1; }
          done
          echo "cloned: $(find _repos -mindepth 1 -maxdepth 1 -type d | wc -l)"
      - name: §10 收敛核验（无 FAIL 才绿）
        run: bash .github/scripts/check-release-standard.sh --repos-dir _repos
