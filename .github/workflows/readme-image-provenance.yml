# README 图片来源审计：按 §8.1 检查 README 图是否复用了仓内截图归档。
# 只读审计，默认月度跑（2026-10-30 定稿：公开仓免费额度，schedule 与 workflow_dispatch 并存）；
# 发现问题只报红，不自动修。
name: README image provenance audit

on:
  schedule:
    # 每月 1 日 04:00 UTC（12:00 Asia/Shanghai）
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      only:
        description: '只审计指定仓库（逗号分隔，留空=全部公开仓）'
        required: false
        default: ''
  pull_request:
    paths:
      - 'governance/REPOSITORY_GUIDELINES.md'
      - '.github/scripts/check-readme-image-provenance.py'
      - '.github/workflows/readme-image-provenance.yml'
      - 'README.md'
      - 'docs/assets/**'

permissions:
  contents: read

jobs:
  provenance:
    name: README image provenance
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Pillow (near-blank heuristic)
        if: github.event_name != 'pull_request'
        shell: bash
        # 钉版：升级 Pillow 等于换近空白启发式的测量口径，须重跑一次全量审计。
        run: python3 -m pip install --quiet --disable-pip-version-check pillow==12.3.0
      - name: Audit README image provenance
        shell: bash
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -o pipefail
          args=(--fail-on-reuse)
          if [ -n "$ONLY" ]; then
            args+=(--only "$ONLY")
          fi
          # PR 只改动了本仓，全账号扫描没有意义；仅审计 .github 并跳过近空白（不下载图片）
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--only .github --skip-blank)
          fi
          python3 .github/scripts/check-readme-image-provenance.py "${args[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
