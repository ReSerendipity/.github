name: Bug 报告
description: 提交一个 Bug 报告帮助我们改进
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告！请尽可能详细地填写以下信息，这能帮助我们快速定位问题。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 简要描述你遇到的问题
      placeholder: "例如：运行时出现错误，功能不符合预期"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 详细描述如何复现这个问题
      placeholder: |
        1. 执行 '...'
        2. 操作 '...'
        3. 观察错误
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: error-log
    attributes:
      label: 错误日志 / 截图
      description: 粘贴错误日志或截图（注意移除其中的敏感信息）
      placeholder: |
        ```
        粘贴错误日志到这里
        ```
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、硬件（GPU/内存）、运行版本等
      placeholder: "例如：Windows 11 / RTX 5070 Ti 12GB / 项目版本 x.y.z"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 相关配置
      description: 与问题相关的配置片段（**请移除敏感信息如密码/Token**）
      render: yaml

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 还有其他需要说明的吗？