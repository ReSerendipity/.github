name: 功能请求
description: 提出一个新功能或改进建议
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景 / 要解决的问题
      description: 这个功能解决了什么问题？当前有哪些不便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你期望的实现方式或使用方式（可含示例）
      render: markdown
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他方案（可选）

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 截图、链接或参考实现等（可选）